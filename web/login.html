<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard - Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .auth-card { width: 100%; max-width: 400px; background: var(--bg-card); border: 1px solid var(--bg-card-border);
                     border-radius: 16px; padding: 36px 32px; backdrop-filter: blur(10px); }
        .auth-brand { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 6px;
                      font-family: var(--font-heading); font-size: 26px; font-weight: 800; color: var(--text-heading); }
        .auth-brand svg { width: 30px; height: 30px; color: var(--accent-primary); }
        .auth-sub { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
        .auth-tabs { display: flex; border-bottom: 1px solid var(--bg-card-border); margin-bottom: 22px; }
        .auth-tab { flex: 1; background: none; border: none; padding: 10px; cursor: pointer; font-weight: 600;
                    font-size: 14px; color: var(--text-muted); border-bottom: 2px solid transparent; font-family: var(--font-sans); }
        .auth-tab.active { color: var(--accent-primary); border-bottom-color: var(--accent-primary); }
        .auth-field { margin-bottom: 16px; }
        .auth-field label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .5px;
                            text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
        .auth-field input { width: 100%; padding: 12px 14px; border-radius: 10px; font-size: 15px;
                            background: var(--bg-input); color: var(--text-main); border: 1px solid var(--bg-card-border);
                            font-family: var(--font-sans); }
        .auth-field input:focus { outline: none; border-color: var(--accent-primary); }
        .auth-submit { width: 100%; margin-top: 6px; }
        .auth-error { min-height: 20px; margin-top: 14px; color: #f87171; font-size: 14px; text-align: center; }
        .auth-hint { margin-top: 18px; text-align: center; font-size: 13px; color: var(--text-muted); }
    </style>
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            PhishGuard
        </div>
        <div class="auth-sub">Sign in to use the phishing detector</div>

        <div class="auth-tabs">
            <button class="auth-tab active" id="tabLogin" type="button">Login</button>
            <button class="auth-tab" id="tabRegister" type="button">Create account</button>
        </div>

        <form id="authForm" autocomplete="on">
            <div class="auth-field">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" required>
            </div>
            <div class="auth-field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary auth-submit" id="authSubmit" type="submit">Login</button>
            <div class="auth-error" id="authError" role="alert"></div>
        </form>
        <div class="auth-hint">Demo account: <b>admin</b> / <b>admin123</b></div>
    </div>
</div>
<script src="js/login.js"></script>
</body>
</html>
